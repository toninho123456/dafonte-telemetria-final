# Publicação GRATUITA no Render (para teste/demonstração).
# Limites do plano grátis: o site "dorme" após 15 min sem acesso (leva ~1 min para acordar),
# o banco grátis expira 30 dias após criado e as fotos dos tratores NÃO ficam salvas (sem disco).
# Confira as regras atuais no painel do Render.
services:
  - type: web
    name: dafonte-telemetria
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: dafonte-db, property: connectionString } }
      - { key: AUTH_SECRET, generateValue: true }
      - { key: AUTH_TRUST_HOST, value: "true" }
      - { key: UPLOAD_DIR, value: /tmp/uploads }
      - { key: SEED_ADMIN_EMAIL, sync: false }
      - { key: SEED_ADMIN_PASSWORD, sync: false }
databases:
  - name: dafonte-db
    plan: free
